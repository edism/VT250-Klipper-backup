#####################################################################
# 	BED mesh
#####################################################################
[bed_mesh]
speed: 300
horizontal_move_z: 8
mesh_min: 30, 30  #Probe location
mesh_max: 220, 220 #Probe location
fade_start: 0.6 # //EM
fade_end: 10.0 # //EM
probe_count: 6,6
algorithm: bicubic
mesh_pps: 2,2                 ; Set to default value, specified so ADAPTIVE_BED_MESH will work //EM
#zero_reference_position: 125, 125

#####################################################################
# 	LED Control
#####################################################################

[output_pin caselight]
# Chamber Lighting - HE0 Connector (Optional)
pin: PE3
pwm:true
shutdown_value: 0
value:1
cycle_time: 0.01

### driven by stealhburner leds.cfg 
[neopixel sb_leds]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW
initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

#[idle_timeout]
#timeout: 1800

[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -10,-10 to the XY coordinates of your endstop pin 
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
home_xy_position:125,125
speed:100
z_hop:10

[z_tilt]
z_positions:
    -50, 18
    125, 298
    300, 18
points:
    30, 5
    125, 195
    220, 5
speed: 400
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075

