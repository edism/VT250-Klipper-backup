[tmc2209 stepper_z]
uart_pin: PF9
interpolate: true
run_current: 0.6 # //EM was 0.65
hold_current: 0.4 ## new
sense_resistor: 0.110
stealthchop_threshold: 0 # was 1

##	Z1 Stepper - Rear  on Motor5
