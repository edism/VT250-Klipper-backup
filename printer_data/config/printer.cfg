dir_pin: !PD6
enable_pin: !PF10
rotation_distance:4
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -2.5
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PF9
interpolate: true
run_current: 0.6 # //EM was 0.65
hold_current: 0.4 ## new
sense_resistor: 0.110
stealthchop_threshold: 0 # was 1

##	Z1 Stepper - Rear  on Motor5
[stepper_z1]
step_pin: PC9
dir_pin: !PC8
enable_pin: !PD1
rotation_distance:4
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PD0
interpolate: true
run_current: 0.6 # //EM was 0.65
hold_current: 0.4 ## new
sense_resistor: 0.110
stealthchop_threshold: 0 # was 1

##	Z2 Stepper - Front Right on Motor6
[stepper_z2]
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA15
rotation_distance:4
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF8
interpolate: true
run_current: 0.6 # //EM was 0.65
hold_current: 0.4 ## new
sense_resistor: 0.110
stealthchop_threshold: 0 # was 1

