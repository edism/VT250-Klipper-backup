######################################
#   MCU section
######################################

[mcu]
canbus_uuid: 13f5d714d97d

[mcu EBBCan] #SB2209
canbus_uuid: 4a4fc4e48dce

#####################################
#  Input shaping
#####################################

[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x

[resonance_tester]
probe_points: 125, 125, 20
accel_chip: adxl345
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

[input_shaper]
shaper_freq_x: 54.4
shaper_type_x: mzv
shaper_freq_y: 37.4
shaper_type_y: mzv
damping_ratio_x: 0.075
damping_ratio_y: 0.146

####################################
#   Printer basics
###################################

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 4100 #4800			
max_z_velocity: 15
max_z_accel: 350
minimum_cruise_ratio: 0
square_corner_velocity: 5

###################################
#   Custom temperature sensors
###################################

[temperature_sensor Toolhead]
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28
max_temp: 95

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PA1
max_temp: 95

[temperature_sensor CB1]
sensor_type: temperature_host
max_temp: 95

[temperature_sensor M8P]
sensor_type: temperature_mcu
max_temp: 95

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on Motor1(B Motor)
[stepper_x]
step_pin: PE2
dir_pin: PB4
enable_pin: !PC11
microsteps: 64 #buvo 16
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: ^EBBCan:gpio24
position_min: -3
position_endstop: 250
position_max: 250
homing_speed: 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC10
interpolate: True
run_current: 0.98 #was 0.8
hold_current: 0.6 ## new
sense_resistor: 0.110
stealthchop_threshold: 0

## Y Stepper on Motor2 (A Motor)
[stepper_y]
step_pin: PF12
dir_pin: PF11
enable_pin: !PB3
microsteps: 64 ## buvo 16
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: ^PF4
position_min: 0
position_endstop: 250
position_max: 252
homing_speed: 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PF13
interpolate: True
run_current: 0.98 #was 0.8
hold_current: 0.6 ## new
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left on MOTOR3_A
